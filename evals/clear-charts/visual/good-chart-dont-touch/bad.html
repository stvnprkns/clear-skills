<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;margin:32px;color:#26323d}.row{display:flex;align-items:center;margin:14px 0}.label{width:140px}.bar{height:26px;background:#cbd3dc}.focus{background:#2867c7}.value{padding-left:8px}.axis{margin-left:140px;border-top:1px solid #bcc4cc;width:650px;color:#667;display:flex;justify-content:space-between}</style><h1>Returns are concentrated in accessories</h1><p>Share of all returns · trailing 90 days</p><div id="c"></div><div class="axis"><span>0%</span><span>20%</span><span>40%</span></div><script>let d=[['Accessories',34],['Footwear',17],['Outerwear',15],['Shirts',13],['Pants',12],['Other',9]];for(let [n,v] of d)document.querySelector('#c').insertAdjacentHTML('beforeend',`<div class=row><span class=label>${n}</span><span class="bar ${n==='Accessories'?'focus':''}" style="width:${v*16.25}px"></span><b class=value>${v}%</b></div>`)</script><p><small>Source: Returns ledger. Denominator: 8,420 returned units.</small></p>
