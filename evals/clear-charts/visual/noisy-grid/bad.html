<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;margin:32px}.chart{display:grid;grid-template-columns:repeat(12,58px);grid-template-rows:repeat(10,36px);width:696px;border:3px solid #555;background:repeating-linear-gradient(0deg,transparent 0 34px,#666 34px 36px),repeating-linear-gradient(90deg,transparent 0 56px,#666 56px 58px)}.dot{width:11px;height:11px;border-radius:50%;background:#2474d2;align-self:center;justify-self:center}</style><h1>Daily orders</h1><p>Gridlines are darker than the data and appear at every minor interval.</p><div class="chart" id="c"></div><script>const c=document.querySelector('#c');for(let i=0;i<12;i++){let d=document.createElement('i');d.className='dot';d.style.gridColumn=i+1;d.style.gridRow=10-Math.round(3+Math.sin(i)*2);c.append(d)}</script>
